[project]
name = "lending_assistant"
authors = [{ name = "Kavin" }]
description = "AI assistant side panel that guides users step by step through Frappe Lending"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = ["anthropic>=1.1.0,<2"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"
