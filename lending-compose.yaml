# Frappe Lending (version-16) + Lending Assistant.
#
#   docker compose -f lending-compose.yaml --project-name lending up -d
#
# Needs the local image lending-local:v16-ai (build it with ./build-assistant.sh).
# Open http://localhost:8080 or http://<machine-ip>:8080  (Administrator / admin)
#
# Optional settings (shell env or a .env file next to this file):
#   SITE_NAME, ADMIN_PASSWORD, DB_ROOT_PASSWORD, ANTHROPIC_API_KEY
#
# `init` runs once per `up`: writes bench config, creates the site on first run,
# on later runs installs missing apps and migrates. Every other service waits for it.

name: lending

x-frappe: &frappe
  image: lending-local:v16-ai
  pull_policy: never # local-only image, never try to pull it
  platform: linux/amd64
  restart: unless-stopped
  volumes:
    - sites:/home/frappe/frappe-bench/sites
  depends_on:
    init:
      condition: service_completed_successfully

services:
  db:
    image: mariadb:11.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MARIADB_AUTO_UPGRADE: "1"
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-changeit123}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - db-data:/var/lib/mysql
    restart: unless-stopped

  redis-cache:
    image: redis:8.6-alpine
    restart: unless-stopped

  redis-queue:
    image: redis:8.6-alpine
    volumes:
      - redis-queue-data:/data
    restart: unless-stopped

  init:
    <<: *frappe
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -e
        ls -1 apps > sites/apps.txt
        bench set-config -g db_host db
        bench set-config -gp db_port 3306
        bench set-config -g redis_cache redis://redis-cache:6379
        bench set-config -g redis_queue redis://redis-queue:6379
        bench set-config -g redis_socketio redis://redis-queue:6379
        bench set-config -gp socketio_port 9000
        bench set-config -g chromium_path /usr/bin/chromium-headless-shell
        if bench --site $$SITE_NAME list-apps >/dev/null 2>&1; then
          echo "Site $$SITE_NAME exists: install missing apps, migrate"
          bench --site $$SITE_NAME list-apps | grep -q lending_assistant || bench --site $$SITE_NAME install-app lending_assistant
          bench --site $$SITE_NAME migrate
        else
          echo "Creating site $$SITE_NAME"
          bench new-site $$SITE_NAME \
            --mariadb-root-password $$DB_ROOT_PASSWORD \
            --admin-password $$ADMIN_PASSWORD \
            --db-root-username root \
            --install-app erpnext \
            --install-app payments \
            --install-app lending \
            --install-app lending_assistant \
            --set-default
          bench --site $$SITE_NAME enable-scheduler
        fi
    environment:
      SITE_NAME: ${SITE_NAME:-lending.localhost}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-changeit123}

  backend:
    <<: *frappe
    environment:
      GUNICORN_WORKERS: "2"
      GUNICORN_THREADS: "4"
      GUNICORN_TIMEOUT: "120"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

  websocket:
    <<: *frappe
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]

  queue-short:
    <<: *frappe
    command: ["bench", "worker", "--queue", "short,default"]

  # Runs the assistant's Claude calls, so it needs the API key too.
  queue-long:
    <<: *frappe
    command: ["bench", "worker", "--queue", "long,default,short"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

  scheduler:
    <<: *frappe
    command: ["bench", "schedule"]

  frontend:
    <<: *frappe
    command: ["nginx-entrypoint.sh"]
    depends_on:
      init:
        condition: service_completed_successfully
      backend:
        condition: service_started
      websocket:
        condition: service_started
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      # Always serve this site, whatever host/IP the browser used (lets http://<ip>:8080 work).
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:-lending.localhost}
      CLIENT_MAX_BODY_SIZE: 50m
      PROXY_READ_TIMEOUT: "120"
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
    ports:
      - "8080:8080"

volumes:
  db-data:
    name: frappe_docker_db-data
  redis-queue-data:
    name: frappe_docker_redis-queue-data
  sites:
    name: frappe_docker_sites

networks:
  default:
    name: frappe_docker_default
